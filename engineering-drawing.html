<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10201c">
<title>Engineering Drawing · Plant Tracker</title>
<style>
:root{color-scheme:dark;--bg:#0c1714;--panel:#14251f;--line:#2b4038;--text:#eef5f1;--muted:#a7b8b0;--green:#1d7057}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Inter,system-ui,-apple-system,Segoe UI,sans-serif}
header{height:auto;min-height:68px;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);background:#10201c;position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:11px;font-weight:750;letter-spacing:.12em}.brand img,.brand-mark{width:36px;height:36px;flex:0 0 36px}
.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.24em}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;max-width:78vw}.actions button{white-space:nowrap}.actions button:focus-visible{outline:2px solid #8dd4aa;outline-offset:2px}
button,a{border:1px solid #385349;background:#1a3028;color:var(--text);border-radius:10px;padding:9px 13px;font:600 13px inherit;text-decoration:none;cursor:pointer}
button:hover,a:hover{background:#25483b}main{padding:18px;max-width:1500px;margin:auto}
.heading{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:2px 0 14px}.heading h1{font-size:clamp(20px,3vw,28px);margin:0}.heading p{margin:4px 0 0;color:var(--muted);font-size:13px}
.viewer{height:calc(100dvh - 160px);min-height:360px;overflow:hidden;border:1px solid var(--line);border-radius:14px;background:#202723;position:relative;touch-action:none;cursor:grab}
.viewer.dragging{cursor:grabbing}.stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transform-origin:center;will-change:transform}
.stage img{display:block;max-width:none;max-height:none;width:auto;height:auto;user-select:none;-webkit-user-drag:none;pointer-events:none}
.hint{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);padding:7px 11px;background:#0c1714dd;border:1px solid #52665d;border-radius:30px;color:#d7e2dc;font-size:11px;white-space:nowrap;pointer-events:none}
@media(max-width:600px){header{padding:10px 12px;align-items:flex-start;flex-direction:column}.actions{max-width:100%;justify-content:flex-start}.brand{font-size:12px}.actions{gap:5px}.actions button,.actions a{padding:8px 9px;font-size:12px}main{padding:12px}.heading{display:block}.viewer{height:calc(100dvh - 180px);min-height:320px}}
</style>
</head>
<body>
<header>
  <div class="brand"><svg class="brand-mark" viewBox="0 0 64 64" role="img" aria-label="Plant Tracker logo"><rect width="64" height="64" rx="15" fill="#1c3f32"/><path d="M14 43 27 15h10l13 28h-9l-3-7H26l-3 7zm15-14h6l-3-8z" fill="#8dd4aa"/><path d="M20 49h24" stroke="#dcefe3" stroke-width="3" stroke-linecap="round"/></svg><span>PLANT<small>TRACKER · ENGINEERING</small></span></div>
  <nav class="actions" aria-label="Drawing controls">
    <button id="fullscreen">⛶ Full screen</button><button id="toolSelect">Select / Move</button><button id="toolLine">Line</button><button id="toolRect">Rectangle</button><button id="toolPoly">Polygon</button><button id="finishPoly">Finish polygon</button><button id="toolPin">Marker</button><button id="renameShape">Rename</button><button id="deleteShape">Delete</button><button id="undoShape">Undo</button><button id="fit">Fit</button><button id="minus" aria-label="Zoom out">−</button><button id="plus" aria-label="Zoom in">＋</button><button id="rotate">Rotate 90°</button><a href="index.html">Back to plant</a>
  </nav>
</header>
<main>
  <div class="heading"><div><h1>Engineering drawing</h1><p>Draw and edit plant zones, routes and equipment markers. Select to move; use two fingers to pan/zoom.</p></div></div>
  <section class="viewer" id="viewer" aria-label="Zoomable engineering drawing">
    <div class="stage" id="stage"><img id="drawing" src="F_D1.jpg" alt="Original plant engineering process flow drawing"><svg id="drawingOverlay" viewBox="0 0 1000 1000" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none"></svg><div id="drawingZoneCard" hidden style="position:absolute;z-index:20;right:12px;top:12px;max-width:min(310px,calc(100% - 24px));background:#111a27;border:1px solid #435367;border-radius:13px;padding:13px;color:#eef5f1;box-shadow:0 8px 24px #0008;font:13px/1.45 system-ui"></div></div>
    <div class="hint">Drag to pan · Pinch or use ＋ / − to zoom</div>
  </section>
</main>
<script>
(()=>{
 const viewer=document.getElementById('viewer'),stage=document.getElementById('stage'),img=document.getElementById('drawing');
 let scale=1,rotation=0,x=0,y=0,drag=null,pointers=new Map(),pinchStart=null;
 function render(){stage.style.transform=`translate(${x}px,${y}px) scale(${scale}) rotate(${rotation}deg)`}
 function fit(){if(!img.naturalWidth)return;const r=viewer.getBoundingClientRect();const rotated=Math.abs(rotation%180)===90;const iw=rotated?img.naturalHeight:img.naturalWidth,ih=rotated?img.naturalWidth:img.naturalHeight;scale=Math.min((r.width-30)/iw,(r.height-30)/ih,1);x=0;y=0;render()}
 function zoom(f){scale=Math.max(.12,Math.min(8,scale*f));render()}
 img.addEventListener('load',fit);if(img.complete)fit();
 document.getElementById('fit').onclick=fit;document.getElementById('plus').onclick=()=>zoom(1.25);document.getElementById('minus').onclick=()=>zoom(.8);
 document.getElementById('rotate').onclick=()=>{rotation=(rotation+90)%360;fit()};
 viewer.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.12:.89)},{passive:false});
 viewer.addEventListener('pointerdown',e=>{if(e.target.closest('#drawingOverlay')&&mode!=='select')return;viewer.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1)drag={x:e.clientX,y:e.clientY,ox:x,oy:y};if(pointers.size===2){const a=[...pointers.values()];pinchStart={dist:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),scale};}viewer.classList.add('dragging')});
 viewer.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1&&drag){x=drag.ox+(e.clientX-drag.x);y=drag.oy+(e.clientY-drag.y);render()}else if(pointers.size===2&&pinchStart){const a=[...pointers.values()];const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);scale=Math.max(.12,Math.min(8,pinchStart.scale*d/pinchStart.dist));render()}});
 function end(e){pointers.delete(e.pointerId);if(pointers.size<2)pinchStart=null;if(!pointers.size){drag=null;viewer.classList.remove('dragging')}else if(pointers.size===1){const p=[...pointers.values()][0];drag={x:p.x,y:p.y,ox:x,oy:y}}}
 viewer.addEventListener('pointerup',end);viewer.addEventListener('pointercancel',end);

 const overlay=document.getElementById('drawingOverlay'),KEY='plant_tracker_engineering_annotations_v1';
 let mode='select',drawing=false,points=[],annotations=[];
 try{annotations=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){annotations=[]} annotations.forEach((a,i)=>{if(!a.id)a.id='DRAW-'+String(i+1).padStart(3,'0')});

 let selectedId=null,gesture=null,undoStack=[];
 const clone=v=>JSON.parse(JSON.stringify(v));
 function snapshot(){undoStack.push(clone(annotations));if(undoStack.length>30)undoStack.shift();}
 function shapeElement(a){
  let el;
  if(a.type==='rect'){el=document.createElementNS('http://www.w3.org/2000/svg','rect');el.setAttribute('x',a.x);el.setAttribute('y',a.y);el.setAttribute('width',a.w);el.setAttribute('height',a.h);el.setAttribute('fill','#35a7ff22');el.setAttribute('stroke','#168cff');el.setAttribute('stroke-width','4');}
  else if(a.type==='pin'){el=document.createElementNS('http://www.w3.org/2000/svg','circle');el.setAttribute('cx',a.x);el.setAttribute('cy',a.y);el.setAttribute('r','10');el.setAttribute('fill','#e3a63f');el.setAttribute('stroke','#fff');el.setAttribute('stroke-width','3');}
  else if(a.type==='line'){el=document.createElementNS('http://www.w3.org/2000/svg','line');el.setAttribute('x1',a.x1);el.setAttribute('y1',a.y1);el.setAttribute('x2',a.x2);el.setAttribute('y2',a.y2);el.setAttribute('stroke','#168cff');el.setAttribute('stroke-width','5');el.setAttribute('stroke-linecap','round');}
  else{el=document.createElementNS('http://www.w3.org/2000/svg','polygon');el.setAttribute('points',a.points.map(p=>p.join(',')).join(' '));el.setAttribute('fill','#35a7ff22');el.setAttribute('stroke','#168cff');el.setAttribute('stroke-width','4');}
  el.dataset.shapeId=a.id;el.style.pointerEvents='auto';el.style.cursor=mode==='select'?'move':'crosshair';
  if(a.id===selectedId){el.setAttribute('stroke','#8dd4aa');el.setAttribute('stroke-width','7');}
  return el;
 }
 function redraw(){
  overlay.innerHTML='';
  annotations.forEach(a=>{
   const el=shapeElement(a);
   el.addEventListener('pointerdown',ev=>{if(mode!=='select')return;ev.preventDefault();ev.stopPropagation();selectedId=a.id;gesture={kind:'move',id:a.id,start:svgPoint(ev),original:clone(a),moved:false};overlay.setPointerCapture(ev.pointerId);redraw();});
   el.addEventListener('click',ev=>{ev.stopPropagation();if(mode==='select'){selectedId=a.id;showDrawingCard(a);redraw();}});
   overlay.appendChild(el);
   const linked=JSON.parse(localStorage.getItem('plant_tracker_org_hierarchy_v1')||'[]').filter(p=>p.drawingId===a.id);
   if(linked.length){const label=document.createElementNS('http://www.w3.org/2000/svg','text');let lx=a.type==='rect'?a.x+8:a.type==='pin'?a.x+14:a.type==='line'?Math.min(a.x1,a.x2):Math.min(...a.points.map(p=>p[0]))+8;let ly=a.type==='rect'?a.y+20:a.type==='pin'?a.y-12:a.type==='line'?Math.min(a.y1,a.y2)-10:Math.min(...a.points.map(p=>p[1]))+20;label.setAttribute('x',lx);label.setAttribute('y',ly);label.setAttribute('fill','#075b42');label.setAttribute('font-size','17');label.setAttribute('font-weight','700');label.textContent=linked.slice(0,2).map(p=>p.role+': '+(p.person||'Vacant')).join(' | ');label.style.pointerEvents='none';overlay.appendChild(label);}
  });
  if(gesture?.kind==='draw'&&gesture.preview){const a=gesture.preview;const el=shapeElement(a);el.style.pointerEvents='none';el.setAttribute('stroke-dasharray','8 6');overlay.appendChild(el);}
  if(points.length){const pl=document.createElementNS('http://www.w3.org/2000/svg','polyline');pl.setAttribute('points',points.map(p=>p.join(',')).join(' '));pl.setAttribute('fill','#35a7ff22');pl.setAttribute('stroke','#8dd4aa');pl.setAttribute('stroke-width','4');pl.setAttribute('stroke-dasharray','8 6');pl.style.pointerEvents='none';overlay.appendChild(pl);}
 }
 function showDrawingCard(a){
  const card=document.getElementById('drawingZoneCard'),positions=JSON.parse(localStorage.getItem('plant_tracker_org_hierarchy_v1')||'[]').filter(p=>p.drawingId===a.id);
  const esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  card.hidden=false;card.innerHTML=`<button id="closeDrawingCard" style="float:right;padding:3px 8px">×</button><b style="font-size:15px">${esc(a.name||'Drawing zone')}</b><div style="color:#a7b8b0;font-size:11px">${esc(a.id)} · ${esc(a.type)}</div><hr style="border:0;border-top:1px solid #34463f"><b>Assigned positions (${positions.length})</b>${positions.length?positions.map(p=>`<div style="padding:6px 0;border-top:1px solid #34463f"><b>${esc(p.role)}</b><br>${esc(p.person||'Vacant')} · ${esc(p.employeeId||'No employee ID')}<br><small>Department: ${esc(p.dept)} · Reports to: ${esc(p.parent||'—')}</small></div>`).join(''):'<p style="color:#a7b8b0">No workforce position linked to this drawing annotation.</p>'}<p style="color:#a7b8b0;font-size:11px">Assignments are managed in Workforce → Link site zone.</p>`;
  document.getElementById('closeDrawingCard').onclick=()=>card.hidden=true;
 }
 function saveAnnotations(){localStorage.setItem(KEY,JSON.stringify(annotations));redraw();window.dispatchEvent(new CustomEvent('planttracker:datachange',{detail:{type:'drawing-annotations'}}));}
 function svgPoint(e){const r=overlay.getBoundingClientRect();return [(e.clientX-r.left)/r.width*1000,(e.clientY-r.top)/r.height*1000]}
 function setMode(next){mode=next;['toolSelect','toolLine','toolRect','toolPoly','toolPin'].forEach(id=>{const b=document.getElementById(id);b.style.outline=(id==='tool'+next[0].toUpperCase()+next.slice(1))?'2px solid #8dd4aa':'none';});viewer.style.cursor=next==='select'?'grab':'crosshair';overlay.style.cursor=next==='select'?'default':'crosshair';}
 function addShape(shape){const name=prompt('Name this drawing feature:',shape.type==='pin'?'Equipment marker':'New '+shape.type);if(name===null)return;snapshot();shape.id='DRAW-'+Date.now()+'-'+Math.random().toString(36).slice(2,6);shape.name=name.trim()||'Unnamed feature';annotations.push(shape);selectedId=shape.id;saveAnnotations();}
 overlay.style.pointerEvents='auto';overlay.style.touchAction='none';
 overlay.addEventListener('pointerdown',ev=>{
  if(mode==='select'){selectedId=null;redraw();return;}
  ev.preventDefault();ev.stopPropagation();overlay.setPointerCapture(ev.pointerId);const p=svgPoint(ev);
  if(mode==='poly'){points.push(p);redraw();return;}
  if(mode==='pin'){addShape({type:'pin',x:p[0],y:p[1]});return;}
  gesture={kind:'draw',start:p,preview:mode==='rect'?{id:'preview',type:'rect',x:p[0],y:p[1],w:0,h:0}:{id:'preview',type:'line',x1:p[0],y1:p[1],x2:p[0],y2:p[1]}};
 });
 overlay.addEventListener('pointermove',ev=>{
  if(!gesture)return;const p=svgPoint(ev);
  if(gesture.kind==='move'){
   const dx=p[0]-gesture.start[0],dy=p[1]-gesture.start[1],a=annotations.find(x=>x.id===gesture.id);if(!a)return;
   Object.assign(a,clone(gesture.original));
   if(a.type==='rect'){a.x+=dx;a.y+=dy;}else if(a.type==='pin'){a.x+=dx;a.y+=dy;}else if(a.type==='line'){a.x1+=dx;a.x2+=dx;a.y1+=dy;a.y2+=dy;}else a.points=a.points.map(q=>[q[0]+dx,q[1]+dy]);
   gesture.moved=Math.abs(dx)+Math.abs(dy)>1;redraw();return;
  }
  if(gesture.kind==='draw'){const a=gesture.preview;if(a.type==='rect'){a.x=Math.min(gesture.start[0],p[0]);a.y=Math.min(gesture.start[1],p[1]);a.w=Math.abs(p[0]-gesture.start[0]);a.h=Math.abs(p[1]-gesture.start[1]);}else{a.x2=p[0];a.y2=p[1];}redraw();}
 });
 overlay.addEventListener('pointerup',ev=>{
  if(!gesture)return;ev.preventDefault();ev.stopPropagation();
  if(gesture.kind==='move'){if(gesture.moved){snapshot();saveAnnotations();}gesture=null;redraw();return;}
  const p=svgPoint(ev),a=gesture.preview;gesture=null;
  if(a.type==='rect'&&a.w>3&&a.h>3)addShape({type:'rect',x:a.x,y:a.y,w:a.w,h:a.h});
  else if(a.type==='line'&&Math.hypot(p[0]-a.x1,p[1]-a.y1)>3)addShape({type:'line',x1:a.x1,y1:a.y1,x2:p[0],y2:p[1]});
  redraw();
 });
 overlay.addEventListener('pointercancel',()=>{gesture=null;redraw();});
 document.getElementById('toolSelect').onclick=()=>{points=[];setMode('select');};
 document.getElementById('toolLine').onclick=()=>{points=[];setMode('line');};
 document.getElementById('toolRect').onclick=()=>{points=[];setMode('rect');};
 document.getElementById('toolPoly').onclick=()=>{points=[];setMode('poly');};
 document.getElementById('finishPoly').onclick=()=>{if(points.length<3){alert('Add at least three polygon corners first.');return;}addShape({type:'poly',points:clone(points)});points=[];redraw();};
 document.getElementById('toolPin').onclick=()=>{points=[];setMode('pin');};
 document.getElementById('renameShape').onclick=()=>{const a=annotations.find(x=>x.id===selectedId);if(!a){alert('Select a drawing feature first.');return;}const n=prompt('Rename feature',a.name||'');if(n!==null){snapshot();a.name=n;saveAnnotations();}};
 document.getElementById('deleteShape').onclick=()=>{if(!selectedId){alert('Select a drawing feature first.');return;}const a=annotations.find(x=>x.id===selectedId);if(!a)return;if(confirm('Delete '+(a.name||'this feature')+'?')){snapshot();annotations=annotations.filter(x=>x.id!==selectedId);selectedId=null;saveAnnotations();}};
 document.getElementById('undoShape').onclick=()=>{if(!undoStack.length)return;annotations=undoStack.pop();selectedId=null;saveAnnotations();};
 document.getElementById('fullscreen').onclick=async()=>{try{if(!document.fullscreenElement)await viewer.requestFullscreen();else await document.exitFullscreen();}catch(e){}};

 setMode('select');redraw();window.addEventListener('storage',ev=>{if(ev.key==='plant_tracker_org_hierarchy_v1'||ev.key===KEY)redraw();});window.addEventListener('planttracker:datachange',()=>redraw());

 window.addEventListener('resize',()=>{if(scale<=1.01)fit()});
})();
</script>
</body>
</html>
